name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Keep this image in sync with both Playwright package-lock.json entries.
    container: &playwright-container
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pin npm for reproducible package archives
        run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - &verify-playwright
        name: Verify preinstalled Playwright browser
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { accessSync, constants, readFileSync } = require('node:fs');
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          const version = require('@playwright/test/package.json').version;
          assert.equal(image.driverVersion, version, 'Update the Playwright image and package together');
          accessSync(require('@playwright/test').chromium.executablePath(), constants.X_OK);
          console.log(`Using preinstalled Playwright ${version}`);
          NODE
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:restored
      - run: npm run test:comparison
      - run: npm run test:package
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Pin npm for reproducible package archives
        run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm test
  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: *playwright-container
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Pin npm for reproducible package archives
        run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - *verify-playwright
      - run: npm run test:browser
      - run: npm run test:package
        timeout-minutes: 8
