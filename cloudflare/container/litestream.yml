# Every SQLite database below /state, including one created while Mau runs, is replicated to the
# assigned replica under db/<path below /state>. The startup script selects the AWS profile.
# Preserve prompt L0 uploads. These intervals govern maintenance of already uploaded files.
l0-retention-check-interval: 1h
levels:
  - interval: 15m
  - interval: 2h
  - interval: 6h
dbs:
  - dir: /state
    pattern: "*.sqlite"
    recursive: true
    watch: true
    meta-dir: /var/lib/litestream
    replica:
      type: s3
      bucket: ${STATE_BUCKET}
      path: ${STATE_PREFIX}db
      endpoint: ${R2_ENDPOINT}
      region: auto
      force-path-style: true
      sign-accept-encoding: false
