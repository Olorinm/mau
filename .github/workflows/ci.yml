name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Two jobs run side by side on separate runners: `test` (typechecks, console build,
# tests with browser acceptance) and `packages` (CLI, Host and archive verification).
# The preparation steps are shared through YAML anchors so both use the same pinned toolchain.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this image in sync with @playwright/test in package-lock.json.
    container: &playwright-container
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.2
      # Do not cache npm here: its file-package cache contains private Environment source.
      - &pin-npm
        run: npm install --global npm@11.16.0
      - &install-gh
        name: Install pinned GitHub CLI for component downloads
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/gh.tar.gz" \
            https://github.com/cli/cli/releases/download/v2.103.3/gh_2.103.3_linux_amd64.tar.gz
          echo "4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d  $RUNNER_TEMP/gh.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP" gh_2.103.3_linux_amd64/bin/gh
          install "$RUNNER_TEMP/gh_2.103.3_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version
      - &read-pins
        id: pins
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const pins=JSON.parse(fs.readFileSync('components.json'));
          for (const name of ['router', 'host', 'connectors']) {
            if (pins[name].distribution === 'local-build') throw new Error(name + ' is an unpublished local build; publish and pin its exact archive before remote release CI. Use the documented local archive verification meanwhile.');
          }
          // A component may live in a subdirectory (`path`) of its repository.
          const source = name => {
            const {repository, path = '.', revision} = pins[name];
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository) || !/^[0-9a-f]{40}$/.test(revision) ||
                !/^[A-Za-z0-9_.-]+(\/[A-Za-z0-9_.-]+)*$/.test(path) || path.split('/').includes('..'))
              throw new Error(name + ': invalid repository, revision or path in components.json');
            return {repository, path};
          };
          const environment = source('environment'), host = source('host');
          console.log('environment_repository='+environment.repository);
          console.log('environment_path='+environment.path);
          console.log('environment_revision='+pins.environment.revision);
          console.log('environment_version='+pins.environment.version);
          console.log('host_repository='+host.repository);
          console.log('host_path='+host.path);
          console.log('host_revision='+pins.host.revision);
          console.log('host_version='+pins.host.version);
          JS
      - &environment-source
        name: Read the pinned private Environment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.pins.outputs.environment_repository }}
          ref: ${{ steps.pins.outputs.environment_revision }}
          path: .components/environment
          ssh-key: ${{ secrets.ENVIRONMENT_READ_KEY }}
          persist-credentials: false
      - &environment-archive
        name: Reproduce the immutable Environment archive
        env:
          ENVIRONMENT_VERSION: ${{ steps.pins.outputs.environment_version }}
          ENVIRONMENT_PACKAGE: .components/environment/${{ steps.pins.outputs.environment_path }}
        run: |
          npm --prefix "$ENVIRONMENT_PACKAGE" ci --include=dev --ignore-scripts --no-audit --no-fund
          (cd "$ENVIRONMENT_PACKAGE" && npm pack --pack-destination "$RUNNER_TEMP")
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          const name=process.env.RUNNER_TEMP+'/olorinm-agent-environment-'+process.env.ENVIRONMENT_VERSION;
          fs.writeFileSync(name+'.tar',gunzipSync(fs.readFileSync(name+'.tgz')));
          JS
      - &bootstrap
        run: node scripts/bootstrap.mjs --environment-archive "$RUNNER_TEMP/olorinm-agent-environment-${{ steps.pins.outputs.environment_version }}.tar"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check preinstalled Playwright browser
        run: |
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict');
          const { readFileSync, accessSync, constants } = require('node:fs');
          const { driverVersion } = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(driverVersion, require('@playwright/test/package.json').version,
            'Update the Playwright image and npm package together');
          accessSync(require('@playwright/test').chromium.executablePath(), constants.X_OK);
          JS
      - run: node_modules/.bin/lark-cli --version
      - run: npm run typecheck
      - run: npm --prefix web run typecheck
      - &build-web
        run: npm run build:web
      - run: npm test
        env:
          # The browser acceptance must not skip silently when the console build is missing.
          MAU_WEB_E2E: "1"
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as `test`, so the Host package and the archives are built with one toolchain.
    container: *playwright-container
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - *setup-node
      - *pin-npm
      - *install-gh
      - *read-pins
      - *environment-source
      - *environment-archive
      - *bootstrap
      # The product package verified below ships the console build (web/dist).
      - *build-web
      - run: npm run verify:cli
      - name: Build the pinned Host package
        env:
          HOST_SOURCE: ${{ runner.temp }}/host-source
          HOST_PACKAGE: ${{ runner.temp }}/host-source/${{ steps.pins.outputs.host_path }}
        run: |
          git clone --filter=blob:none "https://github.com/${{ steps.pins.outputs.host_repository }}.git" "$HOST_SOURCE"
          git -C "$HOST_SOURCE" checkout "${{ steps.pins.outputs.host_revision }}"
          npm --prefix "$HOST_PACKAGE" ci --ignore-scripts --no-audit --no-fund
          npm --prefix "$HOST_PACKAGE" run build
          (cd "$HOST_PACKAGE" && npm pack --silent --pack-destination "$RUNNER_TEMP")
      - name: Verify independent archives and native session continuation
        run: |
          npm run verify:packages -- --environment-archive .packages/agent-environment.tar \
            --host-archive "$RUNNER_TEMP/olorinm-agent-host-${{ steps.pins.outputs.host_version }}.tgz" \
            --host-fixture "$RUNNER_TEMP/host-source/${{ steps.pins.outputs.host_path }}/test/fixtures/codex-server.mjs"
