name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Two jobs run side by side on separate runners: `test` (typechecks, console build, server and
# console tests with browser acceptance, then the web/ui package's own tests) and `packages` (CLI and
# archive verification). The preparation steps are shared through YAML anchors so both use the same
# pinned toolchain.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this image in sync with @playwright/test in package-lock.json and web/package-lock.json.
    container: &playwright-container
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.2
      - &pin-npm
        run: npm install --global npm@11.16.0
      # Downloads the Agent Kit release pinned in components.json and installs dependencies.
      - &bootstrap
        run: node scripts/bootstrap.mjs
      # The server tests (package-lock.json) and the UI package's tests (web/package-lock.json) both drive this browser.
      - name: Check preinstalled Playwright browser
        run: |
          node --input-type=commonjs <<'JS'
          const assert = require('node:assert/strict');
          const { readFileSync, accessSync, constants } = require('node:fs');
          const { createRequire } = require('node:module');
          const { driverVersion } = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          for (const manifest of ['package.json', 'web/package.json']) {
            const playwright = createRequire(require('node:path').resolve(manifest));
            assert.equal(driverVersion, playwright('@playwright/test/package.json').version,
              `Update the Playwright image and npm package together (${manifest})`);
            accessSync(playwright('@playwright/test').chromium.executablePath(), constants.X_OK);
          }
          JS
      - run: node_modules/.bin/lark-cli --version
      - run: npm run typecheck
      # Builds web/ui, then typechecks and builds the console.
      - &build-web
        run: npm run build:web
      - run: npm test
        env:
          # The browser acceptance must not skip silently when the console build is missing.
          MAU_WEB_E2E: "1"
      # The UI package's unit and browser tests run against the web/ui build made by build:web.
      - run: npm --prefix web --workspace ui test
      - run: npm --prefix web --workspace ui run test:browser
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as `test`, so the archives are built with one toolchain.
    container: *playwright-container
    defaults:
      run:
        shell: bash
    steps:
      - *checkout
      - *setup-node
      - *pin-npm
      - *bootstrap
      # The product package verified below ships the console build (web/dist).
      - *build-web
      - run: npm run verify:cli
      - name: Verify independent archives and native session continuation
        run: npm run verify:packages
